<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#101823" />
    <title>Paco Crew</title>
    <link rel="icon" href="icon.png" />
    <link rel="apple-touch-icon" href="icon.png" />
    <link rel="stylesheet" href="leaflet.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="bar">
      <div class="mark">PA<span>CO</span> CREW</div>
      <span id="mute" class="mute" hidden>🔇</span>
    </header>

    <main>
      <p id="note" class="note" hidden></p>

      <section id="race" hidden>
        <h1 id="race-name"></h1>
        <p id="race-facts" class="facts"></p>

        <nav class="tabs">
          <button class="tab on" data-tab="status">Status</button>
          <button class="tab" data-tab="message">Message <span id="unseen" class="badge" hidden></span></button>
        </nav>

        <div class="pane" data-pane="status">
          <div id="status" class="card status"></div>
          <div id="next" class="card"></div>
          <div class="card map-card">
            <div id="map"></div>
            <div class="map-foot">
              <button id="to-runner" class="mini">Runner</button>
              <button id="to-route" class="mini">Full route</button>
              <a id="runner-google" class="mini link" target="_blank" rel="noopener">Runner in Google Maps ↗</a>
            </div>
          </div>
          <div class="card profile-card">
            <svg id="profile" viewBox="0 0 320 96"></svg>
            <div id="profile-legend" class="profile-legend"></div>
            <div id="profile-captions" class="profile-captions"></div>
            <p id="readout" class="readout" hidden></p>
          </div>
          <h2>Checkpoints</h2>
          <div class="card"><table id="table"></table></div>
        </div>

        <div class="pane" data-pane="message" hidden>
          <ul id="history" class="chat card"></ul>
          <form id="free" class="compose">
            <textarea id="text" maxlength="500" rows="1" autocomplete="off" placeholder="Message"></textarea>
            <button class="mini solid">Send</button>
          </form>
        </div>
      </section>
    </main>
    <script type="module" src="app.js"></script>
  </body>
</html>
