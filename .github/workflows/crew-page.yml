# Build and deploy the crew page. Runs on every push to main:
# 1. install the tools, 2. run Paco's tests (the page uses the same route code),
# 3. type-check and build web/dist, 4. push it to the gh-pages branch as one fresh commit.
# GitHub Pages serves that branch at https://programever.github.io/paco/.
name: Crew page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crew-page
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./web/dist
          publish_branch: gh-pages
          force_orphan: true
          user_name: Mega
          user_email: tdtrinh.web@gmail.com
          commit_message: Publish crew page from
