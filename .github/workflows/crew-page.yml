# Build and deploy the crew page. Runs on every push to main:
# 1. install the tools, 2. run Paco's tests (the page uses the same route code),
# 3. type-check and build web/dist, 4. hand web/dist to GitHub Pages.
# No branch holds the built files: GitHub Pages takes them straight from this run
# (Settings > Pages > Source: GitHub Actions). Served at https://programever.github.io/paco/.
name: Crew page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crew-page
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm ci --ignore-scripts
        working-directory: web
      - run: npm run check
        working-directory: web
      - run: npm run build
        working-directory: web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
